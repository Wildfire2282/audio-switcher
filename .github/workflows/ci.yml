# The whole path to a release, unattended.
#
# Two jobs, and the second cannot start unless the first passed:
#   gate    - build, test, fmt, clippy, manifest, plus the packager (size
#             budget, import list), so a release can never ship oversized or
#             gain a runtime dependency unnoticed
#   release - packages and publishes with the same `scripts/package.ps1` the
#             gate just validated
#
# `release` runs on a `v*` tag push, or manually through workflow_dispatch (which
# is how this job gets verified before anyone trusts a tag with it).
# `--verify-tag` stops a manual run from inventing a tag that never existed.
#
# Release notes are content, not build output: they live in
# `.github/release-notes/<tag>.md`, must be bilingual (see AGENTS.md), and must
# describe only user-visible behaviour. They are deliberately not generated from
# commit messages, which can satisfy neither rule.
name: gate

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.7.1
        required: true

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Ensure rustfmt and clippy are installed
        run: rustup component add rustfmt clippy

      - name: Gate (build, test, fmt, clippy, manifest)
        shell: pwsh
        run: ./scripts/smoke.ps1 -GateOnly

      # The release path is part of the gate too: the size budget, the OS-only
      # import list and the embedded manifest are enforced by the packager, so
      # `cargo test` alone would let a packaging regression through.
      - name: Package (size budget, import list, manifest)
        shell: pwsh
        run: ./scripts/package.ps1

  release:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write # creating a release; without this `gh` gets a 403
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "releasing $tag"

      - name: Package (the script the gate just ran)
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $notes = ".github/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "missing release notes: $notes" }
          $asset = Get-ChildItem dist -Filter 'audio-switcher-*.exe' | Select-Object -First 1
          if (-not $asset) { throw 'the packager produced no artifact' }
          gh release create $tag $asset.FullName --title $tag --notes-file $notes --verify-tag
