# The whole path to a release, unattended.
#
# Two jobs, and the second cannot start unless the first passed:
#   gate    - fmt, manifest, test, clippy, plus the packager (size budget,
#             import list), so a release can never ship oversized or gain a
#             runtime dependency unnoticed
#   release - publishes the artifact the gate produced. It does not build: the
#             bytes published are the bytes the size budget and the import
#             scan ran on, so a release cannot differ from what passed.
#
# `release` runs on a `v*` tag push, or manually through workflow_dispatch (which
# is how this job gets verified before anyone trusts a tag with it).
# `--verify-tag` stops a manual run from inventing a tag that never existed.
#
# Release notes are content, not build output: they live in
# `.github/release-notes/<tag>.md`, must be bilingual (see AGENTS.md), and must
# describe only user-visible behaviour. They are deliberately not generated from
# commit messages, which can satisfy neither rule.
name: gate

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.7.1
        required: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    steps:
      # The ref, not the branch the run was dispatched from: a manual release
      # must build the tag's commit, or the bytes published under a tag could
      # come from a later master.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Two caches, because the registry only changes when the lockfile does,
      # while target/ changes on every commit: one key each, and target/ falls
      # back to the newest entry for another lockfile. Sharing one key made any
      # lockfile change a cold build of everything.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
      - name: Cache build output
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-target-

      - name: Ensure rustfmt and clippy are installed
        run: rustup component add rustfmt clippy

      - name: Gate (fmt, manifest, test, clippy)
        shell: pwsh
        run: ./scripts/smoke.ps1 -GateOnly

      # The release path is part of the gate too: the size budget, the OS-only
      # import list and the embedded manifest are enforced by the packager, so
      # `cargo test` alone would let a packaging regression through.
      - name: Package (size budget, import list, manifest)
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload the packaged release
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write # creating a release; without this `gh` gets a 403
    steps:
      # The tagged commit, so the release notes come from the release itself.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "releasing $tag"

      # The gate's own artifact: no second build, so no second set of bytes.
      - name: Download the verified release
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $notes = ".github/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "missing release notes: $notes" }
          $asset = Get-ChildItem dist -Filter 'audio-switcher-*.exe' | Select-Object -First 1
          if (-not $asset) { throw 'the gate produced no artifact' }
          # The sidecar ships with the image: it is what a download is verified
          # against, and `package.ps1` already stages it next to the exe.
          $sum = Get-ChildItem dist -Filter 'audio-switcher-*.exe.sha256' | Select-Object -First 1
          if (-not $sum) { throw 'the gate produced no checksum sidecar' }
          gh release create $tag $asset.FullName $sum.FullName --title $tag --notes-file $notes --verify-tag
